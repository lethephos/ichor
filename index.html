</header>

<div class="controls">
  <div class="famline">
    <span class="row-label" id="familyLbl">Family</span>
    <div class="family-pick">
      <button class="tab family-btn" id="familyBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="familyMenu" aria-labelledby="familyLbl familyName"><span id="familyName"></span><svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5"/></svg></button>
      <ul class="family-menu" id="familyMenu" role="listbox" aria-label="Family" hidden></ul>
    </div>
  </div>
  <div class="srcline">
    <div class="famline src-pick">
      <span class="row-label" id="srcLbl">Source</span>
      <div class="family-pick">
        <button class="tab family-btn" id="srcBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="srcMenu" aria-labelledby="srcLbl srcName"><span id="srcName"></span><svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5"/></svg></button>
        <ul class="family-menu" id="srcMenu" role="listbox" aria-label="Source" hidden></ul>
      </div>
    </div>
    <div class="row" id="srcRow" role="group" aria-label="Source"><span class="row-label">Source</span></div>
    <p class="src-note" id="srcNote" aria-live="polite"></p>
  </div>
  <div class="row tools" id="tools" role="group" aria-label="Explore">
    <button class="act" data-tool="layers" aria-pressed="false">Layers</button>
    <button class="act" data-tool="curses" aria-pressed="false">Stories</button>
    <button class="act" data-tool="thread" aria-pressed="false">Thread</button>
    <button class="act" data-tool="find" aria-pressed="false">Find</button>
  </div>
</div>

<div id="stage">
  <svg id="graph" role="img" aria-label="Family tree of the houses of Atreus and Labdacus"></svg>
  <div class="row-labels" id="rowLabels" aria-hidden="true"></div>
  <div class="hint" id="hint">Tap a figure to open its card. Pinch or scroll to zoom. Lower means descended, not later.</div>
  <button class="act fit-float" id="fitFloat" aria-label="Show the whole tree" title="Whole tree"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><path class="spark" d="M10.00,6.70L10.53,9.47L13.30,10.00L10.53,10.53L10.00,13.30L9.47,10.53L6.70,10.00L9.47,9.47Z"/></svg><span>Whole tree</span></button>
</div>

<aside id="card"><div class="sheet-bar" id="sheetBar"><div class="sheet-top"><button class="grip" id="grip" aria-label="Expand card" aria-expanded="false"></button><span class="sheet-name" id="sheetName" aria-hidden="true"></span><button class="sheet-close" id="sheetClose" type="button" aria-label="Close card"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div><nav class="sheet-nav" id="sheetNav" aria-label="Sections of the card"></nav></div><div id="cardBody" aria-live="polite"></div></aside>
<div class="dock" id="dock">
  <div class="row" id="layerRow" role="group" aria-label="Layers"><span class="row-label">Show</span></div>
  <span class="dock-sep" aria-hidden="true"></span>
  <div class="row" id="exploreRow">
    <span class="row-label">Explore</span>
    <select class="act" id="curseSel" aria-label="Stories">
      <option value="">Stories</option>
    </select>
    <button class="act" id="threadBtn" aria-pressed="false">Ariadne’s thread</button>
    <div class="finder">
      <input class="act" id="finder" type="search" placeholder="Find a figure" autocomplete="off" spellcheck="false"
        role="combobox" aria-label="Find a figure" aria-autocomplete="list" aria-expanded="false" aria-controls="finderList">
      <ul class="finder-list" id="finderList" role="listbox" aria-label="Figures" hidden></ul>
    </div>
  </div>
</div>
